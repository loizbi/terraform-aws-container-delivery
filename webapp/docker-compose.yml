name: ${NAME}
services:
  webapp:
    build: .
    image: ${NAME}:${TAG}
    container_name: ${NAME}_webapp
    restart: unless-stopped

    environment:
      - TZ=Europe/Nicosia
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${NAME}
      - DB_USER=app
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be provided}

    ports:
      - "127.0.0.1:${PORT}10:8080"

    cpus: "1"
    mem_limit: 256m

    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://127.0.0.1:8080/ready.php"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    
    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ${NAME}

  postgres:
    image: postgres:17.6
    container_name: ${NAME}_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: app
      # Pass it dynamically via the CLI, the .env file or any cloud Secret Manager
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - ${NAME}

    cpus: "1"
    mem_limit: 256m

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ${NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  webapp:
    name: ${NAME}
    driver: bridge

volumes:
  postgres_data:
    name: ${NAME}