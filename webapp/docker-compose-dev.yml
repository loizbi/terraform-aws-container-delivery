name: ${NAME}-dev
services:
  webapp:
    build: .
    image: ${NAME}-dev:${TAG}
    container_name: ${NAME}-dev_webapp
    restart: unless-stopped

    environment:
      - TZ=Europe/Nicosia
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${NAME}-dev
      - DB_USER=app
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be provided}

    ports:
      - "127.0.0.1:${PORT}20:8080"

    cpus: "0.5"
    mem_limit: 256m

    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://127.0.0.1:8080/ready.php"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ${NAME}-dev

  postgres:
    image: postgres:17.6
    container_name: ${NAME}-dev_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${NAME}-dev
      POSTGRES_USER: app
      # Pass it dynamically via the CLI, the .env file or any cloud Secret Manager
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - ${NAME}-dev

    cpus: "0.5"
    mem_limit: 256m

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ${NAME}-dev"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  webapp_php-dev:
    name: ${NAME}-dev
    driver: bridge

volumes:
  postgres_data:
    name: ${NAME}-dev